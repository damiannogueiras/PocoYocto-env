services:
  pocoyocto:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        YOCTO_PASS: pocoyo
        HOST_UID: "${UID:-1000}"
    image: damiannogueiras/pocoyocto-env:latest
    container_name: pocoyocto-[machine]
    
    # Configuración de terminal interactiva
    stdin_open: true
    tty: true

    ports:
      - "8000:8000"
      - "2222:22"
    # Volúmenes
    volumes:
      - output-[machine]:/home/pocoyoctouser/output
      - build-[machine]:/home/pocoyoctouser/build
      - ./metas:/home/pocoyoctouser/build/metas
      - ./metas-propias:/home/pocoyoctouser/build/metas-propias

    working_dir: /home/pocoyoctouser

    # Cambia permisos en vol
    # crea entorno build
    # lanza toaster
    # Mantiene el contenedor corriendo
    # chown solo en los volúmenes Docker (output), NO en bind-mounts (metas/)
    # El UID de pocoyoctouser ya coincide con el del host via build arg HOST_UID
    # sshd se arranca explícitamente porque el command pisa el CMD del Dockerfile
    command: /bin/bash -c "sudo /usr/sbin/sshd && sudo chown pocoyoctouser:pocoyoctouser /home/pocoyoctouser/build && sudo chown -R pocoyoctouser:pocoyoctouser /home/pocoyoctouser/output && cd /home/pocoyoctouser/poky && source oe-init-build-env ../build && source toaster start webport=0.0.0.0:8000 && exec /bin/bash"

    # Límites de recursos
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 10G
        reservations:
          cpus: '6'
          memory: 8G

    # Health check
    healthcheck:
      test: [ "CMD", "test", "-d", "/home/pocoyoctouser" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Red personalizada
    networks:
      - pocoyocto-network

    # Reinicio automático
    restart: unless-stopped

    # Variables de entorno
    environment:
      - YOCTO_BUILD_TYPE=minimal
      - TOASTER_DIR=/home/pocoyoctouser/build/toaster_logs
      - BB_ENV_PASSTHROUGH_ADDITIONS=TOASTER_DIR
      - SSTATE_DIR=/home/pocoyoctouser/output/sstate-cache
      - DL_DIR=/home/pocoyoctouser/output/downloads
      - TMPDIR=/home/pocoyoctouser/build/tmp
      - "QB_SLIRP_OPT=-netdev user,id=net0,hostfwd=tcp::2222-:22,tftp=/home/pocoyoctouser/build/tmp/deploy/images/qemuarm64"

networks:
  pocoyocto-network:
    driver: bridge

volumes:
  build-[machine]:
    driver: local
  output-[machine]:
    driver: local
